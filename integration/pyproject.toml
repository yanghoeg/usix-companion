[build-system]
requires = ["setuptools==75.3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "usix-companion-integration"
version = "0.2.0"
description = "Companion-owned device v2 CLI and supervised WSS broker"
requires-python = ">=3.10"
dependencies = ["jsonschema==4.23.0", "referencing==0.35.1", "websockets==15.0.1"]

[project.scripts]
companion-v2 = "usix_companion.cli:main"
companion-broker = "usix_companion.broker:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
usix_companion = ["contracts/*.schema.json"]
