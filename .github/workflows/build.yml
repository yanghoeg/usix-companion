name: build

on:
  push:
    branches: [main, "companion/p2-*", "companion/p3-*"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check architecture and build without an Android SDK
        env:
          ANDROID_HOME: /nonexistent/companion-sdk
          ANDROID_SDK_ROOT: /nonexistent/companion-sdk
        run: |
          python3 -m unittest discover -s tests/architecture -v
          ./gradlew -PcoreOnly=true checkArchitecture :core:domain:check :core:application:check :protocol:check :adapters:transport:check --no-daemon --stacktrace

  build:
    needs: core
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate device contracts
        run: |
          python -m pip install -r tools/requirements-contracts.txt
          python tools/check_contracts.py
          python -m unittest discover -s tests/contracts -v
          python -m unittest discover -s tests/tools -v
          python tools/sync_host_contracts.py --check
      - name: Validate standalone integration and TLS broker
        run: |
          python -m pip install ./integration -r integration/requirements-test.txt
          python -m unittest discover -s integration/tests -v

      - name: Build release APK
        run: |
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            ./gradlew assembleRelease --no-daemon --stacktrace -PversionName="${GITHUB_REF_NAME#v}"
          else
            ./gradlew assembleRelease --no-daemon --stacktrace
          fi

      - name: Run regression tests
        run: ./gradlew checkArchitecture :adapters:transport:test testDebugUnitTest lintDebug --no-daemon --stacktrace
      - name: Validate APK-router wire output
        run: python tools/check_apk_contract_outputs.py

      - name: Build controlled native, Compose and WebView device fixture
        run: ./gradlew :testing:device-fixture:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: usix-companion-fixture
          path: testing/device-fixture/build/outputs/apk/debug/device-fixture-debug.apk

      # Every push/PR: keep the signed APK as a build artifact (expires).
      - uses: actions/upload-artifact@v4
        with:
          name: usix-companion-release
          path: app/build/outputs/apk/release/app-release.apk

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: usix-companion-release
          path: release

      # Only on a version tag (vX.Y.Z): attach the already-built APK to a GitHub Release.
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/app-release.apk
          generate_release_notes: true
