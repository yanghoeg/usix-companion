name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build release APK
        run: |
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            gradle assembleRelease --no-daemon --stacktrace -PversionName="${GITHUB_REF_NAME#v}"
          else
            gradle assembleRelease --no-daemon --stacktrace
          fi

      # Every push/PR: keep the signed APK as a build artifact (expires).
      - uses: actions/upload-artifact@v4
        with:
          name: usix-companion-release
          path: app/build/outputs/apk/release/app-release.apk

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: usix-companion-release
          path: release

      # Only on a version tag (vX.Y.Z): attach the already-built APK to a GitHub Release.
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/app-release.apk
          generate_release_notes: true
