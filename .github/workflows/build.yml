name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write # required to publish a Release on tag push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      # Every push/PR: keep the APK as a build artifact (dev-facing, expires).
      - uses: actions/upload-artifact@v4
        with:
          name: usix-companion-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      # Only on a version tag (vX.Y.Z): attach the APK to a GitHub Release
      # so end users always grab one stable "Latest" download.
      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
